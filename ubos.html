<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UBos — browser + notepad (Windows 11 style)</title>
  <style>
    /* Windows 11-like theme adjustments */
    :root{
      --bg:#0b1220;
      --panel:rgba(255,255,255,0.03);
      --accent:#2563eb;
      --muted:#94a3b8;
      --taskbar-height:64px;
      --glass: rgba(255,255,255,0.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,Roboto,system-ui,Arial;background:linear-gradient(180deg,#071029 0%, #071627 100%);color:#e6eef8}

    /* Desktop */
    .desktop{height:100vh;padding:24px;display:flex;flex-direction:column;gap:12px}
    .dock{display:flex;gap:12px;align-items:center}

    /* App icons */
    .app-icon{width:56px;height:56px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,0.03);transition:transform .18s,box-shadow .18s}
    .app-icon:hover{transform:translateY(-6px);box-shadow:0 10px 30px rgba(0,0,0,0.6)}

    /* Taskbar - centered like Windows 11 */
    .taskbar{position:fixed;left:0;right:0;bottom:16px;height:var(--taskbar-height);display:flex;align-items:center;justify-content:center;pointer-events:none}
    .taskbar-inner{width:fit-content;display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:14px;background:var(--glass);backdrop-filter: blur(10px) saturate(120%);box-shadow:0 8px 30px rgba(2,6,23,0.6);pointer-events:auto}

    .task-left,.task-center,.task-right{display:flex;align-items:center;gap:8px}
    .task-center{gap:10px}

    .task-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px;border-radius:10px;background:transparent;cursor:pointer;color:#e6eef8;font-size:11px;min-width:52px}
    .task-item .icon{font-size:20px}
    .task-item.active{background:linear-gradient(90deg, rgba(37,99,235,0.12), rgba(37,99,235,0.05));box-shadow:0 6px 20px rgba(2,6,23,0.6)}

    /* Start button specifics */
    .start-btn{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);cursor:pointer}

    /* Windows-like window */
    .window{position:absolute;background:rgba(3,7,18,0.8);border:1px solid rgba(255,255,255,0.04);border-radius:12px;box-shadow:0 12px 50px rgba(2,6,23,0.6);overflow:hidden}
    .window .title{display:flex;align-items:center;gap:8px;padding:10px;background:linear-gradient(90deg, rgba(255,255,255,0.01), transparent);font-weight:600}
    .window .controls{margin-left:auto;display:flex;gap:8px}
    .w-btn{width:14px;height:14px;border-radius:50%;display:inline-block}
    .w-btn.close{background:#ff6b6b}
    .w-btn.min{background:#f6c04d}
    .w-btn.max{background:#6be48b}
    .content{height:calc(100% - 48px);background:#071026}

    /* Browser + Notepad specifics */
    .browser-ui{display:flex;flex-direction:column;height:100%}
    .tabbar{display:flex;gap:8px;padding:8px;background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent)}
    .tab{padding:8px 12px;background:transparent;border-radius:10px;color:#cfe6ff;cursor:pointer}
    .tab.active{background:linear-gradient(90deg,#0f3b72,#0b6bb3);font-weight:700}
    .nav{display:flex;gap:8px;padding:10px;background:transparent;align-items:center}
    .nav input{flex:1;padding:8px;border-radius:8px;border:0;background:rgba(0,0,0,0.35);color:#e6eef8}
    .nav button{padding:8px 10px;border-radius:8px;border:0;background:var(--accent);color:white;cursor:pointer}
    .viewer{height:100%;background:white;border-radius:0 0 8px 8px}

    .notepad{display:flex;flex-direction:column;height:100%}
    .notepad textarea{flex:1;padding:12px;border:none;background:transparent;color:#e6eef8;font-family:monospace}

    /* Start menu */
    .start-menu{position:fixed;left:50%;bottom:calc(var(--taskbar-height) + 26px);transform:translateX(-50%);width:600px;background:linear-gradient(180deg, rgba(10,14,20,0.95), rgba(6,10,16,0.95));border-radius:12px;padding:12px;box-shadow:0 18px 50px rgba(2,6,23,0.7);display:none}
    .start-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .pin{background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
    .start-links{margin-top:12px;display:flex;gap:12px;justify-content:space-between}
    .link-btn{background:transparent;border:1px solid rgba(255,255,255,0.03);padding:8px 10px;border-radius:8px;cursor:pointer}

    @media (max-width:700px){ .start-menu{width:92vw} }
  </style>
</head>
<body>
  <div class="desktop" id="desktop">
    <div style="display:flex;gap:12px;align-items:center">
      <h2 style="margin:0">UBos</h2>
      <div class="small">A tiny web OS — Browser + Notepad</div>
    </div>

    <div class="dock">
      <div class="app-icon" id="openBrowser" title="Browser">🌐</div>
      <div class="app-icon" id="openNotepad" title="Notepad">📝</div>
    </div>

    <div style="flex:1"></div>

    <div class="taskbar" id="taskbar">
      <div class="taskbar-inner">
        <div class="task-left">
          <div class="start-btn" id="startBtn">☰</div>
        </div>
        <div class="task-center" id="taskCenter"></div>
        <div class="task-right">
          <div class="small">UBos</div>
        </div>
      </div>
    </div>

    <div class="start-menu" id="startMenu" role="menu">
      <div class="start-grid" id="startGrid">
        <!-- pinned apps populated by JS -->
      </div>
      <div class="start-links">
        <button class="link-btn" id="linkRepo">Open GitHub Repo</button>
        <button class="link-btn" id="linkUBos">Open UBos Home</button>
        <div></div>
      </div>
    </div>
  </div>

  <!-- Browser Window -->
  <div class="window" id="browserWindow" style="width:80%;height:70%;left:8%;top:8%;display:none">
    <div class="title">
      <div>Browser</div>
      <div class="controls">
        <div class="w-btn min" id="minBrowser" title="Minimize"></div>
        <div class="w-btn close" id="closeBrowser" title="Close"></div>
      </div>
    </div>
    <div class="content" style="display:flex;flex-direction:column">
      <div class="browser-ui" style="flex:1;display:flex;flex-direction:column">
        <div class="tabbar" id="ubTabbar"></div>
        <div class="nav">
          <button id="ubBack">◀</button>
          <button id="ubForward">▶</button>
          <input id="ubUrl" placeholder="https://example.com" />
          <button id="ubGo">Go</button>
          <button id="ubNew">New Tab</button>
          <label class="small" style="margin-left:6px">Proxy <input type="checkbox" id="ubProxy" checked /></label>
        </div>
        <div style="flex:1;position:relative;background:white" id="ubViewerWrap">
          <iframe id="ubViewer" sandbox="allow-scripts allow-forms allow-popups" style="position:absolute;inset:0;border:0;width:100%;height:100%"></iframe>
        </div>
      </div>
    </div>
  </div>

  <!-- Notepad Window -->
  <div class="window" id="noteWindow" style="width:50%;height:50%;left:25%;top:25%;display:none">
    <div class="title">
      <div>Notepad</div>
      <div class="controls">
        <div class="w-btn min" id="minNote" title="Minimize"></div>
        <div class="w-btn close" id="closeNote" title="Close"></div>
      </div>
    </div>
    <div class="content notepad">
      <div style="display:flex;gap:8px;padding:8px;background:#081425">
        <input id="noteTitle" placeholder="Filename" style="padding:6px;border-radius:6px;border:none" />
        <button id="saveNote">Save</button>
        <button id="loadNote">Load</button>
      </div>
      <textarea id="noteArea" placeholder="Write notes here..."></textarea>
    </div>
  </div>

<script>
// UBos: manages windows and apps, plus emulated cookie storage and app data
(function(){
  const storageKey = 'ubos_state_v1';
  const cookieKey = 'ubos_cookies_v1';
  function saveState(state){ localStorage.setItem(storageKey, JSON.stringify(state)); }
  function loadState(){ try{return JSON.parse(localStorage.getItem(storageKey))||{};}catch(e){return{}} }

  // Simple cookie jar stored in localStorage keyed by host
  const CookieJar = {
    get(host){ const all = JSON.parse(localStorage.getItem(cookieKey)||'{}'); return all[host]||''; },
    set(host, cookieStr){ const all = JSON.parse(localStorage.getItem(cookieKey)||'{}'); all[host]=cookieStr; localStorage.setItem(cookieKey, JSON.stringify(all)); }
  };

  // Window controls
  const browserWindow = document.getElementById('browserWindow');
  const noteWindow = document.getElementById('noteWindow');
  const taskLeft = document.getElementById('taskLeft');
  const taskCenter = document.getElementById('taskCenter');
  const startBtn = document.getElementById('startBtn');
  const startMenu = document.getElementById('startMenu');
  const startGrid = document.getElementById('startGrid');

  document.getElementById('openBrowser').addEventListener('click', ()=>{ openApp('browser'); });
  document.getElementById('openNotepad').addEventListener('click', ()=>{ openApp('notepad'); });
  document.getElementById('closeBrowser').addEventListener('click', ()=>{ closeApp('browser'); });
  document.getElementById('closeNote').addEventListener('click', ()=>{ closeApp('notepad'); });
  document.getElementById('minBrowser').addEventListener('click', ()=>{ minimizeApp('browser'); });
  document.getElementById('minNote').addEventListener('click', ()=>{ minimizeApp('notepad'); });

  // Notepad app
  const noteArea = document.getElementById('noteArea');
  const noteTitle = document.getElementById('noteTitle');
  document.getElementById('saveNote').addEventListener('click', ()=>{
    const name = noteTitle.value.trim()||'untitled';
    localStorage.setItem('ubos_note_'+name, noteArea.value);
    alert('Saved ' + name);
    refreshTaskbar();
  });
  document.getElementById('loadNote').addEventListener('click', ()=>{
    const name = noteTitle.value.trim()||'untitled';
    const v = localStorage.getItem('ubos_note_'+name)||'';
    noteArea.value = v;
    alert('Loaded ' + name);
  });

  // Taskbar management
  const apps = {
    browser: { id:'browser', title:'Browser', icon:'🌐', el: browserWindow, open: false, minimized: false },
    notepad: { id:'notepad', title:'Notepad', icon:'📝', el: noteWindow, open: false, minimized: false }
  };

  function openApp(name){ const a=apps[name]; if(!a) return; a.open = true; a.minimized = false; a.el.style.display='block'; bringToFront(a.el); refreshTaskbar(); }
  function closeApp(name){ const a=apps[name]; if(!a) return; a.open=false; a.minimized=false; a.el.style.display='none'; refreshTaskbar(); }
  function minimizeApp(name){ const a=apps[name]; if(!a) return; a.minimized = true; a.el.style.display='none'; refreshTaskbar(); }
  function restoreApp(name){ const a=apps[name]; if(!a) return; a.minimized=false; a.open=true; a.el.style.display='block'; bringToFront(a.el); refreshTaskbar(); }

  function bringToFront(el){ // simple z-index by timestamp
    const t = Date.now(); el.style.zIndex = 1000 + t%1000; }

  function refreshTaskbar(){ taskCenter.innerHTML=''; Object.values(apps).forEach(a=>{
    const item = document.createElement('div'); item.className='task-item'+(a.open && !a.minimized? ' active':''); item.title = a.title; item.innerHTML = `<div class="icon">${a.icon}</div><div style="font-size:11px">${a.title}</div>`;
    item.addEventListener('click', ()=>{ if(!a.open || a.minimized) restoreApp(a.id); else minimizeApp(a.id); });
    taskCenter.appendChild(item);
  }); }

  // Browser app — tabbed + proxy + cookie messaging
  const PROXY = 'https://dark-bread-d60d.anpuop1511.workers.dev/?url='; // user worker
  const PUB_PROXY = 'https://api.allorigins.win/raw?url='; // fallback public proxy
  const ubTabbar = document.getElementById('ubTabbar');
  const ubViewer = document.getElementById('ubViewer');
  const ubUrl = document.getElementById('ubUrl');
  const ubGo = document.getElementById('ubGo');
  const ubBack = document.getElementById('ubBack');
  const ubForward = document.getElementById('ubForward');
  const ubNew = document.getElementById('ubNew');
  const ubProxy = document.getElementById('ubProxy');

  let tabs = []; let active = null;
  function makeId(){ return 'tab-'+Date.now()+'-'+Math.random().toString(36).slice(2,9); }
  function titleFromUrl(u){ try{ return new URL(u).hostname.replace(/^www\./,'') }catch(e){ return u; } }

  function renderTabs(){ ubTabbar.innerHTML=''; tabs.forEach(t=>{
    const d = document.createElement('div'); d.className='tab'+(t.id===active? ' active':''); d.textContent = t.title||t.url; d.addEventListener('click', ()=>selectTab(t.id));
    ubTabbar.appendChild(d);
  }); const btn=document.createElement('div'); btn.className='tab'; btn.textContent='+ New'; btn.addEventListener('click', ()=>createTab()); ubTabbar.appendChild(btn); }

  function createTab(url='https://example.com'){ const id=makeId(); const tab={id,url,history:[url],historyIndex:0,title:titleFromUrl(url),mode:'iframe',srcdoc:''}; tabs.push(tab); active=id; renderTabs(); loadTab(tab); saveUBState(); }
  function selectTab(id){ active=id; renderTabs(); const t=tabs.find(x=>x.id===id); if(t) loadTab(t); saveUBState(); }
  function closeTab(id){ if(tabs.length<=1) return; const idx=tabs.findIndex(x=>x.id===id); if(idx===-1) return; tabs.splice(idx,1); if(active===id) active=tabs[Math.max(0,idx-1)].id; renderTabs(); selectTab(active); saveUBState(); }

  function saveUBState(){ localStorage.setItem('ubos_browser_v1', JSON.stringify({tabs,active})); }
  function loadUBState(){ try{ const s=JSON.parse(localStorage.getItem('ubos_browser_v1')||'null'); if(s){tabs=s.tabs;active=s.active;} }catch(e){} }

  // open link in UBos browser (select or create tab)
  function openLinkInBrowser(url){
    if(!url) return;
    // normalize
    if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(url)) url = 'https://' + url;
    // reuse active browser tab or create new
    if(!tabs || tabs.length===0) createTab(url);
    else{
      const t = tabs.find(x=>x.id===active);
      if(t){ pushHistory(t, url); loadTab(t); } else createTab(url);
    }
    // ensure browser app open
    openApp('browser');
  }

  // Fetch through proxy and rewrite resource URLs to go via proxy too, plus inject cookie bridge
  async function fetchAndPrepare(url){
    let proxyPrefix = PROXY;
    try{
      const controller = new AbortController();
      const id = setTimeout(()=>controller.abort(), 1500);
      const probe = await fetch(PROXY + encodeURIComponent('https://example.com'), { method:'GET', signal: controller.signal });
      clearTimeout(id);
      if (!probe.ok) throw new Error('probe failed');
    }catch(e){ proxyPrefix = PUB_PROXY; }

    const proxyUrl = proxyPrefix + encodeURIComponent(url);
    const res = await fetch(proxyUrl);
    if(!res.ok) throw new Error('Proxy HTTP ' + res.status);
    let html = await res.text();

    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');

    const base = doc.querySelector('base') || doc.createElement('base'); base.setAttribute('href', url); doc.head.prepend(base);

    function routeAttr(el, attr){ const val = el.getAttribute(attr); if(!val) return; try{ const abs = new URL(val, url).href; el.setAttribute(attr, proxyPrefix + encodeURIComponent(abs)); }catch(e){} }

    doc.querySelectorAll('img').forEach(img=>routeAttr(img,'src'));
    doc.querySelectorAll('script').forEach(s=>{ if(s.src) routeAttr(s,'src'); });
    doc.querySelectorAll('link[rel="stylesheet"]').forEach(l=>routeAttr(l,'href'));
    doc.querySelectorAll('iframe').forEach(f=>routeAttr(f,'src'));
    doc.querySelectorAll('a').forEach(a=>{ const href = a.getAttribute('href'); if(!href) return; try{ const abs=new URL(href,url).href; a.setAttribute('href', abs); a.setAttribute('target','_self'); }catch(e){} });

    const bridge = doc.createElement('script');
    bridge.textContent = `
      (function(){
        try{
          Object.defineProperty(document, 'cookie', {
            get: function(){ window.parent.postMessage({type:'getCookies', origin:location.origin}, '*'); return ''; },
            set: function(val){ window.parent.postMessage({type:'setCookie', origin:location.origin, cookie: String(val)}, '*'); }
          });
          window.open = function(u){ window.parent.postMessage({type:'openLink', url:String(u)}, '*'); return null; };
        }catch(e){}
      })();
    `;
    doc.head.appendChild(bridge);

    return '<!doctype html>\n' + doc.documentElement.outerHTML;
  }

  async function loadTab(tab){
    ubUrl.value = tab.url;
    if(tab.mode === 'srcdoc' && tab.srcdoc){ ubViewer.srcdoc = tab.srcdoc; return; }
    if(ubProxy.checked){
      try{
        ubViewer.srcdoc = `<html><body style="font-family:system-ui;padding:18px">Loading ${tab.url}...</body></html>`;
        const prepared = await fetchAndPrepare(tab.url);
        tab.mode='srcdoc'; tab.srcdoc = prepared; ubViewer.srcdoc = prepared; tab.title = titleFromUrl(tab.url); renderTabs(); saveUBState();
      }catch(err){
        ubViewer.srcdoc = `<pre style="padding:18px;color:#f87171">Failed: ${err.message}</pre>`;
      }
    } else {
      ubViewer.srcdoc = ''; ubViewer.src = tab.url; tab.mode='iframe';
    }
  }

  // Respond to messages from iframe (cookie set/get etc.)
  window.addEventListener('message', (ev)=>{
    try{
      const m = ev.data;
      if(!m || typeof m !== 'object') return;
      if(m.type === 'getCookies'){
        const host = (m.origin||'');
        const cookies = CookieJar.get(host) || '';
        ev.source.postMessage({type:'cookies', host, cookies}, '*');
      } else if(m.type === 'setCookie'){
        const host = (m.origin||'');
        CookieJar.set(host, m.cookie || '');
      } else if(m.type === 'openLink'){
        const url = m.url; if(!url) return; const t = tabs.find(x=>x.id===active); if(t){ pushHistory(t, url); loadTab(t); }
      }
    }catch(e){}
  }, false);

  function pushHistory(tab, url){ if(tab.history[tab.historyIndex] !== url){ tab.history = tab.history.slice(0, tab.historyIndex+1); tab.history.push(url); tab.historyIndex = tab.history.length -1; } tab.url = url; tab.title = titleFromUrl(url); }

  // UI bindings
  ubGo.addEventListener('click', ()=>{ const t = tabs.find(x=>x.id===active); if(!t) return; const u = normalize(ubUrl.value); pushHistory(t,u); t.mode='iframe'; loadTab(t); });
  ubNew.addEventListener('click', ()=>createTab('https://example.com'));
  ubBack.addEventListener('click', ()=>{ const t = tabs.find(x=>x.id===active); if(!t) return; if(t.historyIndex>0){ t.historyIndex--; t.url=t.history[t.historyIndex]; loadTab(t);} });
  ubForward.addEventListener('click', ()=>{ const t = tabs.find(x=>x.id===active); if(!t) return; if(t.historyIndex < t.history.length-1){ t.historyIndex++; t.url=t.history[t.historyIndex]; loadTab(t);} });

  function normalize(raw){ if(!raw) return ''; if(raw.startsWith('about:')) return raw; if(/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(raw)) return raw; return 'https://' + raw; }

  // load saved browser state or create default
  loadUBState(); if(!tabs || tabs.length===0) createTab('https://example.com'); else { renderTabs(); if(active) selectTab(active); }

  // Start menu: populate pinned apps/links and wire buttons to open in UBos browser
  const pinned = [
    {title:'Browser', icon:'🌐', action: ()=>openApp('browser')},
    {title:'Notepad', icon:'📝', action: ()=>openApp('notepad')},
    {title:'GitHub', icon:'🐙', action: ()=>openLinkInBrowser('https://github.com/ppp65isking/cakcukator')},
    {title:'UBos Home', icon:'🏠', action: ()=>openLinkInBrowser('https://ppp65isking.github.io/cakcukator/')}
  ];

  function renderStartMenu(){ startGrid.innerHTML=''; pinned.forEach(p=>{
    const el = document.createElement('div'); el.className='pin'; el.innerHTML = `<div style="font-size:20px">${p.icon}</div><div style="font-size:13px">${p.title}</div>`;
    el.addEventListener('click', ()=>{ p.action(); hideStartMenu(); }); startGrid.appendChild(el);
  }); }

  startBtn.addEventListener('click', ()=>{ if(startMenu.style.display==='block') hideStartMenu(); else showStartMenu(); });
  document.getElementById('linkRepo').addEventListener('click', ()=>{ openLinkInBrowser('https://github.com/ppp65isking/cakcukator'); hideStartMenu(); });
  document.getElementById('linkUBos').addEventListener('click', ()=>{ openLinkInBrowser('https://ppp65isking.github.io/cakcukator/'); hideStartMenu(); });

  function showStartMenu(){ renderStartMenu(); startMenu.style.display='block'; }
  function hideStartMenu(){ startMenu.style.display='none'; }

  // expose for debugging
  window.UBos = { tabs, selectTab, createTab, pushHistory, openLinkInBrowser };

  // initial taskbar refresh and start menu render
  refreshTaskbar(); renderStartMenu();

})();
</script>
</body>
</html>
